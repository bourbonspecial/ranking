[project]
name = "boulder-ranking"
version = "0.1.0"
description = "Pairwise-comparison ranking engine for hard boulder problems"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ranking = "ranking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ranking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
